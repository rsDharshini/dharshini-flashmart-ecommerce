name: FlashMart CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.f.outputs.frontend }}
      backend:  ${{ steps.f.outputs.backend }}
      infra:    ${{ steps.f.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            frontend:
              - 'flashmart-frontend/**'
            backend:
              - 'lambda_code/**'
            infra:
              - '**.tf'

  build-frontend:
    name: "Frontend | ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'push'
    defaults:
      run:
        working-directory: flashmart-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: flashmart-frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Test
        run: npm test --if-present -- --passWithNoTests
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Verify dist
        run: test -f dist/index.html || (echo "dist/index.html missing" && exit 1)

      - name: Upload artifact
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: flashmart-frontend/dist/
          retention-days: 7

  build-backend:
    name: "Lambda ${{ matrix.service }} | ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, cart_service, order_service, payment_service, product_service, address_service, logs_service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        working-directory: lambda_code/${{ matrix.service }}
        run: |
          [ -f requirements.txt ] && pip install -r requirements.txt -t ./package/ || echo "No requirements.txt"

      - name: Syntax check
        working-directory: lambda_code/${{ matrix.service }}
        run: python -c "import ast; ast.parse(open('lambda_function.py').read()); print('OK')"

      - name: Tests
        working-directory: lambda_code/${{ matrix.service }}
        run: |
          if compgen -G "test_*.py" > /dev/null || [ -d tests ]; then
            pip install pytest boto3 moto && pytest --tb=short || true
          else
            echo "No tests — skip"
          fi

      - name: Package zip
        if: github.ref_name == 'main'
        working-directory: lambda_code/${{ matrix.service }}
        run: |
          mkdir -p ../../zips
          zip -r ../../zips/${{ matrix.service }}.zip . -x "*.pyc" -x "__pycache__/*"

      - name: Upload artifact
        if: github.ref_name == 'main'
        uses: actions/upload-artifact@v4
        with:
          name: lambda-${{ matrix.service }}-${{ github.sha }}
          path: zips/${{ matrix.service }}.zip
          retention-days: 7

  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: changes
    if: github.ref_name == 'main' && (needs.changes.outputs.infra == 'true' || github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'
      - run: terraform init -backend=false
      - run: terraform fmt -check -recursive
      - run: terraform validate

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    if: |
      always() && !cancelled() &&
      (github.ref_name == 'main' || github.ref_name == 'staging')
    steps:
      - uses: actions/checkout@v4

      - name: Bandit (Python)
        run: |
          pip install bandit
          bandit -r lambda_code/ -ll --exit-zero

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, terraform-validate, security-scan]
    if: always()
    steps:
      - name: Report
        run: |
          echo "Branch        : ${{ github.ref_name }}"
          echo "Frontend      : ${{ needs.build-frontend.result }}"
          echo "Backend       : ${{ needs.build-backend.result }}"
          echo "Terraform     : ${{ needs.terraform-validate.result }}"
          echo "Security Scan : ${{ needs.security-scan.result }}"
          if [[ "${{ needs.build-frontend.result }}" == "failure" || \
                "${{ needs.build-backend.result }}"  == "failure" ]]; then
            echo "STATUS: FAILED ❌" && exit 1
          fi
          echo "STATUS: PASSED ✅"